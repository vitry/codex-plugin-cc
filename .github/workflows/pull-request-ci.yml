name: Pull Request CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
        exclude:
          # Node 18 on macOS intermittently deadlocks the concurrent state
          # writers test (cross-process lock acquisition never completes and
          # the 15-minute job timeout fires). Node 18 coverage stays on
          # ubuntu; macOS coverage stays on Node 20/22. Needs a dedicated
          # investigation before this combination can join the matrix.
          - os: macos-latest
            node: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run test suite
        run: npm test

      - name: Run build
        run: npm run build

  windows:
    name: Windows targeted suite
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Windows state, broker endpoint, and process lifecycle
        shell: bash
        run: |
          node --test tests/state.test.mjs tests/process.test.mjs
          node --test tests/broker-endpoint.test.mjs
          node --test --test-name-pattern="Node SQLite reader" tests/zcode-session-transfer.test.mjs
